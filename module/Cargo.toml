[package]
name = "geko-module-router"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
geko-module-sdk.workspace = true
geko-fetch.workspace = true
geko-artifact.workspace = true
osmpbf = "0.3"
tracing.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
geko-module-sdk = { workspace = true, features = ["conformance"] }
tempfile = "3"

# The tests of each pack live in it (countries/<country>/tests/), which is data and has no crate.
[[test]]
name = "pack-es"
path = "../countries/es/tests/pack.rs"

[[test]]
name = "pack-lu"
path = "../countries/lu/tests/pack.rs"
