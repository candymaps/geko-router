# What a car does on average, not the limit: the values of OSRM's `car.lua` (its `speeds.highway` and
# its `speed_reduction`), so that durations can be compared with OSRM's and the difference that
# remains is the algorithm. Provisional until there are real travel times to calibrate against.

# An explicit `maxspeed` is multiplied by this, and it replaces the speed of the class.
maxspeed_factor = 0.8

# Speed (km/h) of a road when OSM has no `maxspeed`, by `highway` class.
[free_flow_kmh]
motorway = 90
motorway_link = 45
trunk = 85
trunk_link = 40
primary = 65
primary_link = 30
secondary = 55
secondary_link = 25
tertiary = 40
tertiary_link = 20
unclassified = 25
residential = 25
living_street = 10
service = 15
