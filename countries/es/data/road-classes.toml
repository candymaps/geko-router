# Free-flow speed (km/h) of a road when OSM has no `maxspeed`, by `highway` class. An explicit
# `maxspeed` always wins. Initial values, to calibrate against the golden routes and the
# historical traffic before the first release of the pack.

[free_flow_kmh]
motorway = 120
motorway_link = 60
trunk = 100
trunk_link = 50
primary = 90
primary_link = 50
secondary = 80
secondary_link = 40
tertiary = 70
tertiary_link = 40
unclassified = 50
residential = 30
living_street = 20
service = 20
